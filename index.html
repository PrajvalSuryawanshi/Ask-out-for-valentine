<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valentines Day</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Confetti (STABLE, NO MODULE) -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    .gradient-background {
      background: linear-gradient(
        180deg,
        rgba(255, 208, 229, 1) 0%,
        rgba(255, 232, 242, 1) 36%,
        rgba(255, 255, 255, 1) 100%
      );
    }

    .bounce2 {
      animation: bounce2 2s ease infinite;
    }

    @keyframes bounce2 {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-20px); }
      60% { transform: translateY(-10px); }
    }
  </style>
</head>

<body class="gradient-background">

  <!-- AUDIO -->
  <audio id="bgSong" src="song.mp3" preload="auto"></audio>

  <div class="flex items-center justify-center h-screen">
    <div class="flex flex-col items-center p-4">

      <!-- IMAGE -->
      <img
        id="imageDisplay"
        src="image1.gif"
        class="rounded-md max-h-[300px] w-auto"
        style="object-fit: contain;"
        alt="Cute"
      />

      <!-- TEXT -->
      <h2
        id="valentineQuestion"
        class="text-4xl font-bold italic text-[#bd1e59] my-4 text-center"
      >
        Will you be my Valentine Soan papri (Tanishka)?
      </h2>

      <!-- BUTTONS -->
      <div class="flex gap-4 pt-[20px]" id="responseButtons">
        <button
          id="yesButton"
          class="bounce2 bg-green-500 hover:bg-green-400 text-white px-4 py-2 rounded-md text-[20px]"
        >
          Yes
        </button>

        <button
          id="noButton"
          class="bg-red-500 hover:bg-red-700 text-white px-4 py-2 rounded-md text-[20px]"
        >
          No
        </button>
      </div>

    </div>
  </div>

  <!-- SCRIPT -->
  <script>
    const yesButton = document.getElementById("yesButton");
    const noButton = document.getElementById("noButton");
    const imageDisplay = document.getElementById("imageDisplay");
    const valentineQuestion = document.getElementById("valentineQuestion");
    const responseButtons = document.getElementById("responseButtons");
    const bgSong = document.getElementById("bgSong");

    let noClickCount = 0;
    let songStarted = false;

    const imagePaths = [
      "image1.gif",
      "image2.gif",
      "image3.gif",
      "image4.gif",
      "image5.gif",
      "image6.gif",
      "image7.jpg"
    ];

    const noTexts = [
      "No",
      "Are you sure?",
      "Pookie please 🥺",
      "Don't do this to me :(",
      "You're breaking my heart 💔",
      "I'm gonna cry..."
    ];

    function startSongSmooth() {
      if (songStarted) return;
      songStarted = true;

      bgSong.volume = 0;
      bgSong.play().catch(() => {});

      let vol = 0;
      const fade = setInterval(() => {
        if (vol < 0.6) {
          vol += 0.05;
          bgSong.volume = vol;
        } else {
          clearInterval(fade);
        }
      }, 200);
    }

    noButton.addEventListener("click", () => {
      startSongSmooth();

      if (noClickCount < imagePaths.length - 1) {
        noClickCount++;
        imageDisplay.src = imagePaths[noClickCount];
        noButton.textContent = noTexts[noClickCount] || "No";
        yesButton.style.transform = "scale(" + (1 + noClickCount * 0.25) + ")";
      }
    });

    yesButton.addEventListener("click", () => {
      imageDisplay.src = "image7.jpg";
      valentineQuestion.textContent = "Yayyyy!! 💖🥹";
      responseButtons.style.display = "none";

      confetti({
        particleCount: 150,
        spread: 80,
        origin: { y: 0.6 }
      });
    });
  </script>

</body>
</html>
