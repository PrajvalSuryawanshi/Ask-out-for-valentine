<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valentines Day</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    .gradient-background {
      background: linear-gradient(
        180deg,
        rgba(255, 208, 229, 1) 0%,
        rgba(255, 232, 242, 1) 36%,
        rgba(255, 255, 255, 1) 100%
      );
    }

    .bounce2 {
      animation: bounce2 2s ease infinite;
    }

    @keyframes bounce2 {
      0%, 20%, 50%, 80%, 100% {
        transform: translateY(0);
      }
      40% {
        transform: translateY(-20px);
      }
      60% {
        transform: translateY(-10px);
      }
    }
  </style>
</head>

<body class="gradient-background">

  <!--  AUDIO (same folder as index.html) -->
  <audio id="bgSong" src="song.mp3" preload="auto"></audio>

  <div class="flex items-center justify-center h-screen">
    <div class="flex flex-col items-center p-4">

      <!-- IMAGE -->
      <img
        id="imageDisplay"
        src="image1.gif"
        alt="Cute kitten"
        class="rounded-md max-h-[300px] w-auto"
        style="object-fit: contain;"
      />

      <!-- TEXT -->
      <h2
        id="valentineQuestion"
        class="text-4xl font-bold italic text-[#bd1e59] my-4 text-center"
      >
        Will you be my Valentine Soan papri (tanishka) ?
      </h2>

      <!-- BUTTONS -->
      <div class="flex gap-4 pt-[20px] items-center" id="responseButtons">
        <button
          id="yesButton"
          class="bounce2 rounded-md text-[20px] font-medium bg-green-500 hover:bg-green-400 text-white px-4 py-2 min-h-[48px] min-w-[80px] transition"
        >
          Yes
        </button>

        <button
          id="noButton"
          class="rounded-md text-[20px] font-medium bg-red-500 hover:bg-red-700 text-white px-4 py-2 min-h-[48px] min-w-[80px] transition"
        >
          No
        </button>
      </div>

    </div>
  </div>

  <!-- SCRIPT -->
  <script type="module">
    import confetti from 'https://cdn.skypack.dev/canvas-confetti';

    const yesButton = document.getElementById('yesButton');
    const noButton = document.getElementById('noButton');
    const imageDisplay = document.getElementById('imageDisplay');
    const valentineQuestion = document.getElementById('valentineQuestion');
    const responseButtons = document.getElementById('responseButtons');
    const bgSong = document.getElementById('bgSong');

    let noClickCount = 0;
    let buttonHeight = 48;
    let buttonWidth = 80;
    let fontSize = 20;

    let songStarted = false;

    const imagePaths = [
      "image1.gif",
      "image2.gif",
      "image3.gif",
      "image4.gif",
      "image5.gif",
      "image6.gif",
      "image7.jpg"
    ];

    const noTexts = [
      "No",
      "Are you sure?",
      "Pookie please ",
      "Don't do this to me :(",
      "You're breaking my heart ",
      "I'm gonna cry..."
    ];

    function startSongSmooth() {
      if (!songStarted) {
        songStarted = true;
        bgSong.volume = 0;
        bgSong.play();

        let vol = 0;
        const fade = setInterval(() => {
          if (vol < 0.6) {
            vol += 0.05;
            bgSong.volume = vol;
          } else {
            clearInterval(fade);
          }
        }, 200);
      }
    }

    noButton.addEventListener('click', () => {
      startSongSmooth();

      if (noClickCount < 5) {
        noClickCount++;
        imageDisplay.src = imagePaths[noClickCount];

        buttonHeight += 35;
        buttonWidth += 35;
        fontSize += 25;

        yesButton.style.height = buttonHeight + "px";
        yesButton.style.width = buttonWidth + "px";
        yesButton.style.fontSize = fontSize + "px";

        noButton.textContent = noTexts[noClickCount];
      }
    });

    yesButton.addEventListener('click', () => {
      imageDisplay.src = "image7.jpg";
      valentineQuestion.textContent = "Yayyyy!! ";
      responseButtons.style.display = "none";
      confetti();
    });
  </script>
</body>
</html>
